name: Release

# Tag-driven release: `git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0`.
# Each runner packages the artifact for its own OS because jpackage cannot
# cross-compile; the Android APK is built once on Linux.
#
# The artifacts are unsigned. Signing/notarization needs repository secrets
# (APPLE_ID / APPLE_TEAM_ID / WINDOWS_CERT_*).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Package desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            format: dmg
          - os: windows-2025
            format: msi
          - os: ubuntu-24.04
            format: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux packaging dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot binutils
      - name: Build the host JNI library
        run: ./scripts/build-jni-desktop.sh
      - name: Package with jpackage
        run: ./apps/compose/gradlew -p apps/compose :desktop:packageDistributionForCurrentOS
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: fograin-${{ matrix.format }}
          path: apps/compose/desktop/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error

  android:
    name: Package Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.2.12479018'
      - name: Build the Rust JNI library
        run: ./scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the release APK
        run: ./apps/compose/gradlew -p apps/compose :android:assembleRelease
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: fograin-apk
          path: apps/compose/android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
