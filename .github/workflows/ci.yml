name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The tag is the release source of truth. Every other job depends on this
  # one, so a tag that disagrees with Cargo.toml / gradle.properties fails
  # before any artifact is built.
  version:
    name: Version and wrapper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: gradle/actions/wrapper-validation@v4
      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/version.sh check "$RELEASE_TAG"

  rust:
    name: Rust core
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The three desktop jobs are identical except for the runner and the X11
  # shim: the shared UI, the JNI bridge and the Compose UI tests must pass on
  # every OS, not just macOS.
  compose-desktop-macos:
    name: Compose Desktop (macOS)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the host JNI library
        run: ./scripts/build-jni-desktop.sh
      - name: Test the shared layer and the desktop shell
        run: ./apps/compose/gradlew -p apps/compose :shared:desktopTest :desktop:test

  compose-desktop-linux:
    name: Compose Desktop (Linux)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the X11/GL runtime Skiko needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgtk-3-0
      - name: Build the host JNI library
        run: ./scripts/build-jni-desktop.sh
      # AWT/Skiko need a display; the Compose UI tests run headless under Xvfb.
      - name: Test the shared layer and the desktop shell
        run: xvfb-run -a ./apps/compose/gradlew -p apps/compose :shared:desktopTest :desktop:test

  compose-desktop-windows:
    name: Compose Desktop (Windows)
    needs: version
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the host JNI library
        run: ./scripts/build-jni-desktop.sh
      - name: Test the shared layer and the desktop shell
        run: ./apps/compose/gradlew -p apps/compose :shared:desktopTest :desktop:test

  compose-android:
    name: Compose Android + Rust JNI
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Compose client uses compileSdk 37; name the SDK packages explicitly
      # so the job never depends on setup-android's defaults.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.2.12479018'
      - name: Build the Rust JNI library
        run: ./scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android client
        run: ./apps/compose/gradlew -p apps/compose :android:assembleDebug
      - name: Build the release APK (unsigned without signing secrets)
        run: ./apps/compose/gradlew -p apps/compose :android:assembleRelease
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fograin-android-debug
          path: apps/compose/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error