org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Single source of truth for the shipped version. The Android shell and the
# desktop installers both read these; nothing hard-codes a version string.
# jpackage rejects versions whose major component is 0, so the installer keeps
# its own 1.x line until the app reaches 1.0.
fograin.version=0.1.0
fograin.packageVersion=1.0.0
