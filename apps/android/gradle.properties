org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The SDK packages are installed explicitly (CI and docs), so AGP must not fetch
# remote SDK manifests. On machines where `cmdline-tools` writes a newer package
# XML than AGP 8.7 understands, that fetch stalls the build for minutes.
android.builder.sdkDownload=false
