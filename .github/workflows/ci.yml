name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    name: macOS SwiftUI
    # macOS 14 arm64 was retired from GitHub Actions on 2026-11-02.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-macos.sh --test

  windows:
    name: Windows WinUI 3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # `dotnet build` runs the WinUI XAML compiler out of process
      # (tools/net472/XamlCompiler.exe). When that process fails, MSBuild only
      # reports "MSB3073 ... exited with code 1" and the compiler's diagnostics
      # stay behind in obj/.../output.json. Visual Studio's MSBuild runs the
      # same compiler in process and prints the real XAML error instead.
      - uses: microsoft/setup-msbuild@v3
      - name: Build
        run: >
          msbuild apps/windows/Fograin.Windows/Fograin.Windows.csproj
          /restore /nologo /v:minimal
          /p:Configuration=Release /p:Platform=x64
          /p:UseXamlCompilerExecutable=false
          /bl:"${{ runner.temp }}\windows-build.binlog"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            ${{ runner.temp }}/windows-build.binlog
            apps/windows/Fograin.Windows/obj/**/output.json
            apps/windows/Fograin.Windows/obj/**/input.json
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux GTK4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Install GTK4/libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential pkg-config
      - run: cargo build --manifest-path apps/linux/Cargo.toml --locked

  android:
    name: Android Compose (best effort)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # setup-android v3 asked for the retired "tools" package by default
      # (`sdkmanager tools` -> "Failed to find package 'tools'" -> exit 1).
      # v4 fixed the default, but name the SDK packages explicitly anyway so
      # the job never depends on the action's defaults; AGP runs with
      # android.builder.sdkDownload=false, so nothing more is fetched later.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./apps/android/gradlew -p apps/android assembleDebug
