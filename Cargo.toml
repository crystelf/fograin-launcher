[workspace]
resolver = "3"
members = ["crates/*", "bindings/fg-ffi"]
exclude = ["apps/linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
authors = ["Fograin Launcher contributors"]
publish = false

[workspace.dependencies]
fg-auth = { path = "crates/fg-auth" }
fg-content = { path = "crates/fg-content" }
fg-core = { path = "crates/fg-core" }
fg-diag = { path = "crates/fg-diag" }
fg-game = { path = "crates/fg-game" }
fg-java = { path = "crates/fg-java" }
fg-loader = { path = "crates/fg-loader" }
fg-net = { path = "crates/fg-net" }
fg-task = { path = "crates/fg-task" }
fg-world = { path = "crates/fg-world" }

bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
iana-time-zone = "0.1.65"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "stream",
    "socks",
    "gzip",
    "http2",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["local-offset"] }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "fs",
    "sync",
    "time",
    "macros",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
